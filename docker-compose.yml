services:
  postgres:
    image: postgres:16-alpine
    container_name: timekeeper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timekeeper}
      POSTGRES_DB: ${POSTGRES_DB:-timekeeper}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timekeeper} -d ${POSTGRES_DB:-timekeeper}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: timekeeper-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-timekeeper}:${POSTGRES_PASSWORD:-timekeeper}@postgres:5432/${POSTGRES_DB:-timekeeper}?schema=public
      API_PORT: 3001
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: timekeeper-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    profiles:
      - full

volumes:
  postgres_data:
